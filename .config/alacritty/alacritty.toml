[colors]
transparent_background_colors = true

[colors.cursor]
cursor = "#eeeeee"
text = "CellBackground"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.selection]
background = "#3e4451"
text = "CellForeground"

[env]
WINIT_X11_SCALE_FACTOR = "1"

[font]
size = 11.5

[font.normal]
family = "Iosevka Nerd Font"
style = "Bold"  # Regular

[window]
dynamic_title = true
opacity = 1
title = "Alacritty"

[window.padding]
x = 5
y = 5

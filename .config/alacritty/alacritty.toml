[colors]
transparent_background_colors = true

[colors.cursor]
cursor = "#eeeeee"
text = "CellBackground"

[colors.normal]
black = "#5c6370"
blue = "#61afef"
cyan = "#56b6c2"
green = "#98c379"
magenta = "#c678dd"
red = "#e06c75"
white = "#828997"
yellow = "#e5c07b"

[colors.primary]
background = "#000000"
foreground = "#c5c8c6"

[colors.selection]
background = "#3e4451"
text = "CellForeground"

[env]
WINIT_X11_SCALE_FACTOR = "1"

[font]
size = 11.5

[font.normal]
family = "Iosevka Nerd Font"
style = "Bold"  # Regular

[window]
dynamic_title = true
opacity = 0.65
title = "Alacritty"

[window.padding]
x = 5
y = 5

[general]
import = [
"~/.config/alacritty/colors.toml"
]

#[colors.cursor]
#text = "CellBackground"

[colors]
transparent_background_colors = true

#[colors.selection]
#text = "CellForeground"

[env]
WINIT_X11_SCALE_FACTOR = "1"

[font]
size = 11.5

[font.normal]
family = "Iosevka Nerd Font"
style = "Bold"  # Regular

[window]
dynamic_title = true
opacity = 0.65
title = "Alacritty"

[window.padding]
x = 5
y = 5

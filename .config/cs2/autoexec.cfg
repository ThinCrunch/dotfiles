// SETTINGS
// Crosshair
// Ordered as here: https://prosettings.net/tools/cs2-crosshair-database/
cl_crosshairstyle 4
cl_crosshair_recoil false
cl_crosshairdot false
cl_crosshairsize 1
cl_crosshairthickness 1
cl_crosshairgap -4
cl_crosshair_drawoutline false
cl_crosshair_outlinethickness 0.2
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 200
cl_crosshairalpha 255
cl_crosshair_t false

// Radar
cl_hud_radar_scale 1
cl_radar_square_with_scoreboard false
cl_radar_always_centered false
cl_radar_scale 0.4

// Viewmodel
viewmodel_fov 68
viewmodel_offset_x  2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5

// General
sensitivity 2
zoom_sensitivity_ratio 1
fps_max 75
snd_mute_mvp_music_live_players true
cl_use_opens_buy_menu false
cl_crosshair_sniper_width 1
cl_sniper_auto_rezoom true
cl_teamcounter_playercount_instead_of_avatars true
cl_teammate_colors_show true
cl_mute_enemy_team true
cl_player_ping_mute 1
cl_hud_color 3

// KEYBINDS
// Nades
bind v slot6   // HE
bind c slot7   // Flashbang
bind x slot8   // Smoke
bind t slot10  // Molotov

// Jumpthrow + Runthrow binds
bind f1 +forward
bind f2 +jump
bind f3 -attack
bind f4 -attack2

// Quickswitch
alias +quickswitch slot3
alias -quickswitch "slot2;slot1"
bind q +quickswitch

// Buybinds
bind kp_1 "buy m4a1_silencer; buy ak47"
bind kp_2 "buy famas; buy galilar"
bind kp_3 "buy mp9; buy mac10"
bind kp_4 buy deagle
bind kp_5 "buy fiveseven; buy tec9"
bind kp_6 buy vest
bind kp_7 buy awp
bind kp_8 buy ssg08
bind kp_9 buy p250
bind kp_enter buy vesthelm
bind kp_plus buy defuser
bind kp_0 buy smokegrenade
bind kp_del buy hegrenade
bind kp_divide "buy incgrenade; buy molotov"
bind kp_multiply buy flashbang
bind kp_minus buy decoy

// General
bind j noclip
bind z radio
bind y messagemode
bind f5 +spray_menu
bind ` toggleconsole
bind mouse3 player_ping
bind mouse4 voice_modenable_toggle
bind mouse5 +voicerecord

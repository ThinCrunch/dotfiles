#
#(not) AUTOGENERATED HYPR CONFIG.
#PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
#OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
#

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,highrr,auto,auto
monitor = eDP-1,1920x1080@75,0x0,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us, us
    kb_variant = , intl
    kb_model =
    kb_options = grp:alt_shift_toggle
    float_switch_override_focus = false

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = -0.7  # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 0
    col.active_border = rgba(77ffffff) rgba(8888ffff) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 2
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 6, default, fade
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

#master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#    new_is_master = true
#}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = off
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = elan1201:00-04f3:3098-touchpad
    sensitivity = 0
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod, M, exec, ~/Documents/Code/Bash/hypr_leave.sh
bind = $mainMod SHIFT, space, togglefloating, 
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, fullscreen, 0
#bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Media player control
bind = $mainMod SHIFT, U, exec, playerctl previous
bind = $mainMod SHIFT, I, exec, playerctl play-pause
bind = $mainMod SHIFT, O, exec, playerctl next

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move windows with keyboard
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Workspaces
# workspace=WORKSPACE,RULES
workspace = 1,monitor:eDP-1,monitor:HDMI-A-1
workspace = 2,monitor:eDP-1,monitor:HDMI-A-1
workspace = 3,monitor:eDP-1,monitor:HDMI-A-1
workspace = 4,monitor:eDP-1,monitor:HDMI-A-1
workspace = 5,monitor:eDP-1,monitor:HDMI-A-1
workspace = 6,monitor:eDP-1
workspace = 7,monitor:eDP-1

# Screenshots - grim, slurp, wl-clipboard
bind = $mainMod SHIFT, S, exec, slurp | grim -g - - | wl-copy

bind = $mainMod SHIFT, SEMICOLON, exec, hyprlock

# Waybar
exec-once = waybar

# Wallpaper
exec-once = hyprpaper

# Remove weeb
misc {
    force_default_wallpaper = 0
}

# Scratchpad
workspace = special:shell_scratch
workspace = special:files_scratch
bind = $mainMod, SEMICOLON, exec, /home/thincrunch/Bash/scratchterm_hypr.sh shell_scratch
bind = $mainMod, O, exec, /home/thincrunch/Bash/scratchterm_hypr.sh files_scratch "-e ranger"

# Keyboard brightness
bind = , XF86KbdBrightnessDown, exec, asusctl --prev-kbd-bright
bind = , XF86KbdBrightnessUp, exec, asusctl --next-kbd-bright

# Volume controls
bind = , XF86AudioRaiseVolume, exec, pamixer --increase 5
bind = , XF86AudioLowerVolume, exec, pamixer --decrease 5
bind = , XF86AudioMute, exec, pamixer --toggle-mute

# Blurs fuzzel, dunst
layerrule = blur, launcher
layerrule = blur, notifications
layerrule = blur, bar

# Windowrules >:(
windowrulev2 = workspace special:shell_scratch silent,class:(shell_scratch)
windowrulev2 = workspace special:files_scratch silent,class:(files_scratch)

windowrulev2 = float, size 1000 700, class:(shell_scratch)
windowrulev2 = size 1000 700,class:(shell_scratch)
windowrulev2 = float,class:(files_scratch)
windowrulev2 = size 1000 700,class:(files_scratch)

windowrulev2 = opacity 0.99, class:LibreWolf #librewolf transparency fix

bind = $mainMod, G, movetoworkspacesilent, special:terminal

# Screen brightness
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+

# Firewalld applet
exec-once = nm-applet
# exec-once = gammastep-indicator # replace for wlsunset (probably)
exec-once = sleep 2 && firewall-applet

# Updates notification
exec-once = arch-update --check

# Polkit
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1

# Charge limit (because it resets when starting Hyprland for some reason?)
exec-once = asusctl -c 80


# HYPRLAND CONFIG
# https://wiki.hypr.land/Configuring/
# vim:fileencoding=utf-8:foldmethod=marker

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/colors.conf

# Monitors {{{

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor = ,highrr,auto,auto
monitor = eDP-1,1920x1080@75,0x0,1
monitor = HDMI-A-1,1920x1080@75,1920x0,1,vrr,1
#monitor = , highres@highrr, auto, 1, mirror, eDP-1

# }}}

# Environmental Variables {{{
# Some default env vars.
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, elementary
env = HYPRCURSOR_SIZE, 24
env = XCURSOR_THEME, elementary
env = HYPRCURSOR, elementary

env = MESA_VK_WSI_PRESENT_MODE, immediate
env = KWIN_DRM_NO_AMS, 1
env = PROTON_USE_NTSYNC, 1
env = PROTON_ENABLE_WAYLAND, 1
env = SDL_VIDEODRIVER, wayland

env = AQ_DRM_DEVICES, /dev/dri/card2
env = CLUTTER_BACKEND,wayland
env = NVD_BACKEND,direct

env = QS_ICON_THEME, kora

#:/dev/dri/card1 - second gpu (NVidia?)
# }}}

# Variables {{{
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us, us
    kb_variant = , intl
    kb_model =
    kb_options = grp:alt_shift_toggle
    float_switch_override_focus = false

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    # clamped: [-1.0; 1.0], 0 means no modification.

    # calculating libinput accel speed from a multiplier:
    # normal_multiplier = <libinput_sens> + 1 = eDPI / DPI
    # libinput_sens = (eDPI / DPI) - 1

    #sensitivity = -0.3    # 400 DPI
    #sensitivity = -0.33    # 600 DPI
    sensitivity = -0.65   # 800 DPI
    #sensitivity = -0.825  # 1600 DPI
    accel_profile = flat
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    allow_tearing = true

    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = $color12
    col.inactive_border = $bg_t
    resize_on_border = false

    # Includes scratchpads
    col.nogroup_border_active = $color12
    col.nogroup_border = $bg_t

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    
    blur {
        enabled = true
        popups = true
        size = 3
        passes = 3
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, default
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 6, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default
    animation = specialWorkspace, 1, 2, default, fade
    animation = layersIn, 1, 5, default, slide
    animation = layersOut, 1, 5, default, slide
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

#master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#    new_is_master = true
#}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = elan1201:00-04f3:3098-touchpad
    sensitivity = 0
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

render {
    direct_scanout = true
}

misc {
    force_default_wallpaper = 0
}
# }}}

# Keybinds {{{
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod, M, exec, ~/Bash/hypr_leave.sh
bind = $mainMod SHIFT, space, togglefloating, 
#bind = $mainMod, D, exec, rofi -show drun -show-icons
bind = $mainMod, D, exec, rofi -show drun -show-icons -modes "drun,w:~/Bash/rofi-walls.sh,p:~/Bash/rofi-power.sh"
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, fullscreen, 0

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Media player control
bind = $mainMod SHIFT, U, exec, playerctl previous
bind = $mainMod SHIFT, I, exec, playerctl play-pause
bind = $mainMod SHIFT, O, exec, playerctl next

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move windows with keyboard
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Power modes
bind = $mainMod, F10, exec, powerprofilesctl set balanced
bind = $mainMod, F11, exec, powerprofilesctl set power-saver

# Screenshots
# grim, slurp, wl-clipboard
bind = $mainMod SHIFT, S, exec, slurp | grim -g - - | wl-copy

# Paste image from clipboard using blobdrop
bind = $mainMod, V, exec, ~/Bash/clipdrop.sh

bind = $mainMod SHIFT, SEMICOLON, exec, hyprlock

# Keyboard brightness
bind = , XF86KbdBrightnessDown, exec, asusctl --prev-kbd-bright
bind = , XF86KbdBrightnessUp, exec, asusctl --next-kbd-bright

# Volume controls
bind = , XF86AudioRaiseVolume, exec, pamixer --increase 5
bind = , XF86AudioLowerVolume, exec, pamixer --decrease 5
bind = , XF86AudioMute, exec, pamixer --toggle-mute

# Screen brightness
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+

# Scratchpads
bind = $mainMod, SEMICOLON, exec, pypr toggle term
bind = $mainMod, O, exec, pypr toggle files
# }}}

# Workspaces {{{
# workspace=WORKSPACE,RULES
workspace = 1,monitor:eDP-1,monitor:HDMI-A-1
workspace = 2,monitor:eDP-1,monitor:HDMI-A-1
workspace = 3,monitor:eDP-1,monitor:HDMI-A-1
workspace = 4,monitor:eDP-1,monitor:HDMI-A-1
workspace = 5,monitor:eDP-1,monitor:HDMI-A-1
workspace = 6,monitor:eDP-1
workspace = 7,monitor:eDP-1

# }}}

# Startup Programs {{{
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec-once = waybar
#exec-once = hyprpaper
exec-once = awww-daemon
exec-once = dunst
exec-once = pypr

# Clipboard manager - https://wiki.hyprland.org/Useful-Utilities/Clipboard-Managers/
exec-once = wl-clip-persist --clipboard regular

# Applets
exec-once = nm-applet
exec-once = gammastep-indicator
exec-once = sleep 2 && firewall-applet

# }}}

# Startup Actions {{{
# Updates notification
exec-once = ~/Bash/notify-updates.sh

# Charge limit (because it resets when starting Hyprland for some reason?)
exec-once = asusctl -c 80

# Set cursor
exec-once = hyprctl setcursor elementary 24

exec-once = hyprctl dispatch workspace 2  # add timeout before if not working

#exec-once = swww img --transition-step 255 ~/Pictures/Wallpapers/lavender-cat.png
# }}}

# Layer Rules {{{
# `hyprctl layers`
layerrule = match:namespace waybar,        blur true
layerrule = match:namespace waybar,        ignore_alpha 0.1
layerrule = match:namespace quickshell,    blur true
layerrule = match:namespace quickshell,    blur_popups true
layerrule = match:namespace quickshell,    ignore_alpha 0.1
layerrule = match:namespace rofi,          blur true
layerrule = match:namespace .*,            animation fade
layerrule = match:namespace notifications, blur true
layerrule = match:namespace notifications, ignore_alpha 0.1
layerrule = match:namespace notifications, animation slide


# }}}

# Window Rules >:( {{{
windowrule = match:class .*,               suppress_event maximize
windowrule = match:focus false,            no_shadow true
windowrule = match:class blobdrop,         float true
windowrule = match:class AppImageLauncher, float true
windowrule = match:class Windscribe,       float true

# Steam
windowrule = match:class ^(steam)$, tile true
windowrule = match:class ^(steam)$, match:title ^(notificationtoasts.*|)$, rounding 0
windowrule = match:class ^(steam)$, match:title ^(notificationtoasts.*|)$, float true

windowrule = match:class = (^cs2$)|(^steam_app.*), immediate true

# Needed for screen sharing
# https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override
windowrule = match:class ^(xwaylandvideobridge)$, no_anim true
windowrule = match:class ^(xwaylandvideobridge)$, no_initial_focus true
windowrule = match:class ^(xwaylandvideobridge)$, max_size 1 1
windowrule = match:class ^(xwaylandvideobridge)$, no_blur true
windowrule = match:class ^(xwaylandvideobridge)$, no_focus true

# }}}

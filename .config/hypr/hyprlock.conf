background {
    monitor =
    path = screenshot  # supports png, jpg, webp (no animations, though)
    color = rgba(25, 20, 20, 0.5)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 2 # 0 disables blurring
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Iosevka Nerd Font Mono
    placeholder_text = <i><span foreground="##555555">Input Password...</span></i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgba(250, 250, 250, 0.8)
    font_size = 80
    font_family = Iosevka Extrabold
    rotate = 0 # degrees, counter-clockwise

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = Hello, $USER
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgba(250, 250, 250, 0.8)
    font_size = 17
    font_family = Iosevka Nerd Font Mono
    rotate = 0 # degrees, counter-clockwise

    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = layout: $LAYOUT
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgba(250, 250, 250, 0.8)
    font_size = 8
    font_family = Iosevka Nerd Font Mono
    rotate = 0 # degrees, counter-clockwise

    position = 0, 10
    halign = center
    valign = bottom
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/Bash/whatsong.sh)" 
    color = $foreground
    #color = rgba(255, 255, 255, 0.6)
    font_size = 15
    font_family = Iosevka Nerd Font Mono
    position = 0, 0
    halign = center
    valign = bottom
}

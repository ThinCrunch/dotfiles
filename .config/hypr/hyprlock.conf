# vim:fileencoding=utf-8:foldmethod=marker
source = ~/.config/hypr/colors.conf

# Background {{{
background {
    monitor =
    path = screenshot  # supports png, jpg, webp (no animations, though)
    color = $bg  # fallback color

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 2 # 0 disables blurring
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.4
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# }}}

# User login {{{
image {
    path = /home/thincrunch/Pictures/ProfilePics/clanky.png
    size = 150
    rounding = 5
    border_size = 0

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = $fg
    font_size = 17
    font_family = Iosevka Nerd Font Mono
    rotate = 0 # degrees, counter-clockwise

    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 40
    rounding = 5
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = $fg_t
    font_color = $fg
    fade_on_empty = false
    font_family = Iosevka Nerd Font Mono
    placeholder_text = Input Password...
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# }}}

# Time {{{

label {
    monitor =
    text = $TIME
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = $fg
    font_size = 80
    font_family = Iosevka Extrabold
    rotate = 0 # degrees, counter-clockwise

    position = 0, 270
    halign = center
    valign = center
}

# }}}

# Left Labels {{{
$ll_font_size = 16
$ll_font_family = Iosevka Nerd Font Mono
$ll_x = 100

# Date
label {
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"

    font_size = $ll_font_size
    font_family = $ll_font_family
    color = $fg

    halign = left
    position = $ll_x, 360
}

# KB Layout
label {
    text = $LAYOUT

    font_size = $ll_font_size
    font_family = $ll_font_family
    color = $fg

    halign = left
    position = $ll_x, 330
}

# Uptime
label {
    text = cmd[update:1000] echo -e "$(uptime -p)"

    font_size = $ll_font_size
    font_family = $ll_font_family
    color = $fg

    position = $ll_x, 300
    halign = left
}

# Song
label {
    text = cmd[update:1000] echo "$(~/Bash/whatsong.sh)" 

    font_size = $ll_font_size
    font_family = $ll_font_family
    color = $fg

    position = $ll_x, 270
    halign = left
}

# }}}

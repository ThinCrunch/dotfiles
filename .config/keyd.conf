# THIS CONFIGURATION FILE IS ACTUALLY IN /etc/keyd/config.conf
# FILE IN .config ONLY EXISTS TO GET IT TO GITHUB
[ids]

*

[main]
# Maps capslock to escape when pressed
capslock = esc

# Remaps the escape key to capslock
esc = capslock

# Maps the asus key to 3 (replacement for a malfunctioning key)
scrolldown = 3
